<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b1105">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Trading Journal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My Trading Journal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@600;700&family=Great+Vibes&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<div class="top"><button id="acb" class="row" aria-label="Accounts" style="background:none;border:0;padding:0;text-align:left;gap:10px;cursor:pointer;color:inherit"><span id="acav"></span><div><h1 id="acn"></h1><div class="sub" id="hi"></div></div><span class="sub">▾</span></button><div class="brand">YT7</div></div>

<main id="home" data-tab>
<section class="card hero">
<div class="sub">Account balance</div>
<div class="balrow"><div class="bal" id="bal"></div><button class="swp" id="curswap" aria-label="Change currency"><svg class="svg" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
<div class="alt" id="balalt"></div>
<div class="chg" id="chg"></div>
<div class="bars" id="bars"></div>
<div class="row" style="margin-top:16px"><button class="pill o" data-flow="1" style="flex:1"><svg class="svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Deposit</button><button class="pill l" data-flow="-1" style="flex:1">Withdraw</button></div>
</section>
<button id="adstrip" class="adstrip" type="button" aria-label="Ads"><span class="adi">📢</span><span class="adt"><b>Ads</b></span><span class="adg">No ads</span></button>
<section class="qa">
<button id="qa-add"><svg class="svg gfx" viewBox="0 0 24 24"><defs><linearGradient id="gq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4f53c"/><stop offset="1" stop-color="#ffd66b"/></linearGradient></defs><rect x="2.5" y="3.5" width="17" height="17" rx="5.5" fill="url(#gq)" stroke="none"/><path d="M11 8v7M7.5 11.5h7" stroke="#141a05" stroke-width="2" stroke-linecap="round"/><path class="spk" d="M19.5 1.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#d4f53c" stroke="none"/></svg>New<br>Trade</button>
<button id="qa-lot"><svg class="svg gfx2" viewBox="0 0 24 24"><defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4f53c"/><stop offset="1" stop-color="#ffd66b"/></linearGradient></defs><rect x="4.5" y="2.5" width="15" height="19" rx="4.5" fill="url(#gl)" stroke="none"/><rect x="7.5" y="5.5" width="9" height="4" rx="1.4" fill="#141a05" stroke="none"/><g fill="#141a05" stroke="none"><circle class="kk k1" cx="8.7" cy="13" r="1.1"/><circle class="kk k2" cx="12" cy="13" r="1.1"/><circle class="kk k3" cx="15.3" cy="13" r="1.1"/><circle class="kk k2" cx="8.7" cy="17" r="1.1"/><circle class="kk k3" cx="12" cy="17" r="1.1"/><circle class="kk k1" cx="15.3" cy="17" r="1.1"/></g></svg>Lot<br>Size</button>
<button id="qa-tgt"><svg class="svg gfx2" viewBox="0 0 24 24"><defs><linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4f53c"/><stop offset="1" stop-color="#ffd66b"/></linearGradient></defs><circle cx="12" cy="13" r="9" fill="url(#gt)" stroke="none"/><circle cx="12" cy="13" r="6" fill="#141a05" stroke="none"/><circle class="ring" cx="12" cy="13" r="3.4" fill="url(#gt)" stroke="none"/><circle cx="12" cy="13" r="1.2" fill="#141a05" stroke="none"/><path class="dart" d="M21.5 2.5L13 12" stroke="#d4f53c" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>Monthly<br>Target</button>
</section>
<section class="card">
<div class="row sp"><h2>Equity curve</h2><div class="row" id="rng"><button class="chip" data-r="7">1W</button><button class="chip" data-r="30">1M</button><button class="chip" data-r="90">3M</button><button class="chip on" data-r="0">All</button></div></div>
<div id="chart"><div id="tip"></div></div>
</section>
<section id="tgt" class="card"></section>
<section id="today" class="card"></section>
<section class="grid2" id="stats" style="margin-bottom:12px"></section>
<section class="card" id="rec"></section>
<section class="card"><h2 style="margin-bottom:6px">Insights</h2><div id="ins"></div></section>
</main>

<main id="cal" data-tab hidden>
<section class="card">
<div class="row sp" style="margin-bottom:10px"><button class="chip" id="pv">‹</button><h2 id="mt" style="font-size:15px"></h2><button class="chip" id="nx">›</button></div>
<div class="row sp" style="margin-bottom:10px"><div class="sub" id="msum"></div><div class="row"><button class="chip" data-u="R">R</button><button class="chip" data-u="$">$</button></div></div>
<div class="cg" id="cg"></div>
</section>
<section id="wkc"></section>
</main>

<main id="jr" data-tab hidden>
<div class="row" style="margin-bottom:10px;flex-wrap:wrap" id="flt"><button class="chip on" data-f="all">All</button><button class="chip" data-f="w">Wins</button><button class="chip" data-f="l">Losses</button><button class="chip" data-f="b">Rules broken</button></div>
<section class="card" id="jl"></section>
</main>

<main id="mo" data-tab hidden>
<div class="row sp mohead"><h1>More</h1><button class="gear" id="gear" aria-label="Settings"><svg class="svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
<section class="card" id="prof"></section>
<section class="card" id="tools"><h2 style="margin-bottom:4px">Trading tools</h2>
<button class="srow" id="tl-ses" style="border-top:0"><span>🌍 Market sessions<small class="sub" style="display:block">Open / close times and overlap in your local time</small></span><span>›</span></button>
<button class="srow" id="tl-news"><span>📰 Economic calendar<small class="sub" style="display:block">High-impact news alerts</small></span><span>›</span></button></section>
<section class="card"><h2 style="margin-bottom:10px">Account settings</h2>
<div class="grid2">
<label>Starting balance<input id="sb" type="number" step="any" inputmode="decimal"></label>
<label>Currency<select id="sc"><option>$</option><option>ETB</option></select></label>
<label>Default risk %<input id="sr" type="number" step="any" inputmode="decimal"></label>
<label>Max trades / day<input id="sm" type="number" inputmode="numeric"></label>
</div>
<div id="sbar" hidden><button class="pill l" id="ssave" style="flex:1">Save</button><button class="pill o" id="scan" style="flex:1">Cancel</button></div></section>
<section class="card" id="calc"><h2 style="margin-bottom:4px">Lot size calculator</h2><div class="sub" style="margin-bottom:10px">Enter the pair, entry, stop loss and the amount you're willing to risk.</div>
<div class="grid2">
<label class="full">Pair<div class="sel"><select id="cp_pair"></select><button type="button" class="plus" id="cp_add" aria-label="Add pair">+</button></div></label>
<label>Entry<input id="cp_entry" type="number" step="any" inputmode="decimal"></label>
<label>Stop loss<input id="cp_sl" type="number" step="any" inputmode="decimal"></label>
<label>Risk amount<div class="curin"><i id="cp_cur">$</i><input id="cp_risk" type="number" step="any" inputmode="decimal"></div></label>
<label>Pips (auto)<input id="cp_pips" type="text" readonly tabindex="-1" placeholder="Auto"></label>
<label class="full" id="cp_pvw" style="display:none">Pip value $/lot (needed for this pair)<input id="cp_pv" type="number" step="any" inputmode="decimal"></label>
</div>
<div class="note" id="cp_out" style="margin-top:10px"></div></section>
<section class="card"><h2 style="margin-bottom:6px">Deposits &amp; withdrawals</h2><div id="fl"></div></section>
</main>
</div>

<div class="nav"><div id="nav"></div></div>
<div class="bk" id="bk"></div>
<div class="sheet" id="sh"></div>
<div id="vw"></div>
<div id="toast"></div>
<div id="stg"></div>
<div id="win"></div>
<div id="dlg"></div>
<div id="lock"></div>
<div id="auth"></div>

<script src="config.js"></script>
<script src="script.js" defer></script>
</body>
</html>
